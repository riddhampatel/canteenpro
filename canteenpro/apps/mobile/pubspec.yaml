name: canteenpro
description: CanteenPro — employee & manager app for canteen management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  onesignal_flutter: ^5.2.5
  intl: ^0.19.0
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: assets/icon.png
